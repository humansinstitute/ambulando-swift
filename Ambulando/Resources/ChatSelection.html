<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'"><style>
:root { -webkit-text-size-adjust:100%; color-scheme:light; font:13px -apple-system; color:#10162b; --border:#d5dfda; --muted:#f1f5f3; --link:#0b5cc7 }
:root.dark { color-scheme:dark; --border:#42504b; --muted:#111d29 }
* { box-sizing:border-box } html,body { margin:0; padding:0; background:transparent; overflow:hidden }
#message { display:flow-root; overflow-wrap:anywhere; -webkit-user-select:text; user-select:text; line-height:var(--body-line-height,normal) }
#message>:first-child { margin-top:0 } #message>:last-child { margin-bottom:0 }
p,ul,ol,blockquote,.table-scroll,.code { margin:0 0 .8em } h1,h2,h3,h4,h5,h6 { margin:.8em 0 .5em; line-height:1.25 }
h1 {font-size:1.6em} h2 {font-size:1.35em} h3,h4,h5,h6 {font-size:1.15em}
a { color:var(--link); text-decoration:underline } mark { background:var(--muted); color:var(--link); font-weight:600 }
blockquote { border-left:3px solid var(--border); padding:.4em .8em; background:var(--muted) } li>p { margin-bottom:.35em }
code { color:#16354b; font: .88em ui-monospace,Menlo,monospace; background:var(--muted) } pre { margin:0; padding:.7em; overflow-x:auto; white-space:pre; overflow-wrap:normal }
:root.dark code { color:#e8eef2 }
.code { border:1px solid var(--border); border-radius:7px; overflow:hidden; background:var(--muted) }
.code-toolbar { display:flex; justify-content:space-between; align-items:center; padding:.3em .7em; font-size:.8em }
button { font:inherit; color:inherit; background:transparent; border:1px solid var(--border); border-radius:5px; padding:.35em .7em; min-height:32px }
[data-no-copy] { -webkit-user-select:none; user-select:none }
.table-scroll { overflow-x:auto; max-width:100%; padding:1px } table { border-collapse:collapse; font-size:.88em; width:100%; min-width:22em; overflow-wrap:normal }
th,td { border:1px solid var(--border); padding:.5em .65em; text-align:left; vertical-align:top; min-width:7em; max-width:28em } th {background:var(--muted)}
img { max-width:100%; max-height:384px; height:auto; object-fit:contain } .stored-image {display:block} .stored-image span {display:block; font-size:.8em}
hr { border:0; border-top:1px solid var(--border) }
</style></head><body><article id="message" aria-label="Message text"><!--CONTENT--></article></body></html>
